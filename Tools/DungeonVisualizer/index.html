<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Dungeon Viz</h1>
                <div class="tool-toggles">
                    <button id="tool-shape" class="tool-btn active" title="Edit Shape">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 3h18v18H3z"></path>
                        </svg>
                    </button>
                    <button id="tool-door" class="tool-btn" title="Add Doors">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 22V2M2 12h20"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="panel room-creator-panel">
                <h2>Room Creator</h2>
                <div class="mini-grid-container">
                    <div id="mini-grid" class="mini-grid">
                        <!-- Generated by JS -->
                    </div>
                </div>
                <input type="text" id="room-name" placeholder="Room Name" class="room-name-input">
                <button id="btn-save-room" class="action-btn primary">Save Room</button>
            </div>

            <div class="panel room-palette-panel">
                <h2>Room Palette</h2>
                <div id="room-palette" class="room-list">
                    <!-- Draggable room items will go here -->
                </div>
            </div>

            <div class="panel layout-controls-panel">
                <h2>Layout Controls</h2>
                <div class="mode-switcher">
                    <button id="mode-edit" class="mode-btn active">Edit</button>
                    <button id="mode-play" class="mode-btn">Play</button>
                </div>

                <div class="size-inputs">
                    <div class="input-group">
                        <label>W</label>
                        <input type="number" id="dungeon-width" value="10" min="4" max="20">
                    </div>
                    <div class="input-group">
                        <label>H</label>
                        <input type="number" id="dungeon-height" value="10" min="4" max="20">
                    </div>
                </div>

                <div class="control-actions">
                    <button id="btn-set-start" class="action-btn" title="Click grid to set start">Set Start Pos</button>
                    <button id="btn-save-layout" class="action-btn">Save Layout</button>
                    <button id="btn-reset-layout" class="action-btn warning">Reset Layout</button>
                    <button id="btn-clear-all" class="action-btn danger">Clear All</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="grid-container" class="grid-container">
                <div id="main-grid" class="main-grid">
                    <!-- Generated by JS -->
                </div>
                <div id="player-token" class="player-token hidden"></div>
            </div>
            <div class="status-bar">
                <span id="status-text">Ready</span>
                <span id="coordinates-text">0, 0</span>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
